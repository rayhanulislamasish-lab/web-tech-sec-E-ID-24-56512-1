<!DOCTYPE html>
<html>
<head>
<title>1st and 2nd table</title>
</head>

<body>

<!-- ===== 1st table ===== -->
<h3>1st table</h3>
<table border="1">
  <tr>
    <th>Name</th>
    <th>ID</th>
  </tr>
  <tr>
    <td>A</td>
    <td>10</td>
    <td rowspan="3"> ISD </td>
  </tr>
  <tr>
    <td>B</td>
    <td>11</td>
  </tr>
</table>

<br><br>

<!-- ===== 2nd table ===== -->
<h3>2nd table</h3>
<table border="1">
  <tr>
    <td>AB</td>
    <td>BC</td>
    <td>CD</td>
    <td>DE</td>
  </tr>
  <tr>
    <td rowspan="4">EF<br>ZX</td>
    <td colspan="3">GH</td>
  </tr>
  <tr>
    <td colspan="3">IJ</td>
  </tr>
  <tr>
    <td rowspan="2">KL</td>
    <td>MN</td>
    <td rowspan="2">OP</td>
  </tr>
  <tr>
    <td>NO</td>
  </tr>
</table>

</body>
</html>
